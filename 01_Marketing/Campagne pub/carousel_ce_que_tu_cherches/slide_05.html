<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ekho — Slide 5/5</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #F2EDE7;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 90px 130px;
  }

  /* Decorative wave/circle motif */
  .deco-circle {
    position: absolute;
    border-radius: 50%;
    border: 2px solid #1A1B2E;
    opacity: 0.05;
  }
  .dc-1 { width: 700px; height: 700px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .dc-2 { width: 500px; height: 500px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .dc-3 { width: 300px; height: 300px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

  /* Violet accent line top */
  .top-accent {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #6B54FF, transparent 80%);
  }

  /* Slide number */
  .slide-number {
    position: absolute;
    top: 54px;
    right: 64px;
    font-size: 26px;
    font-weight: 400;
    color: #1A1B2E;
    opacity: 0.25;
    letter-spacing: 3px;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    font-size: 24px;
    font-weight: 700;
    color: #6B54FF;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 64px;
    opacity: 0.7;
  }

  .line-1 {
    font-size: 84px;
    font-weight: 900;
    color: #1A1B2E;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .line-2 {
    font-size: 36px;
    font-weight: 400;
    color: #1A1B2E;
    opacity: 0.4;
    margin-bottom: 60px;
    letter-spacing: 1px;
  }

  .line-accent {
    font-size: 80px;
    font-weight: 900;
    font-style: italic;
    color: #6B54FF;
    line-height: 1.15;
    margin-bottom: 70px;
  }

  /* Beta badge */
  .beta-badge {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #1A1B2E;
    border-radius: 60px;
    padding: 18px 40px;
  }
  .beta-dot {
    width: 10px;
    height: 10px;
    background: #6B54FF;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.3); }
  }
  .beta-text {
    font-size: 24px;
    font-weight: 700;
    color: #F2EDE7;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 90px;
    background: #F2EDE7;
    border-top: 1.5px solid rgba(26,27,46,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .footer-logo {
    font-size: 28px;
    font-weight: 900;
    font-style: italic;
    color: #1A1B2E;
    letter-spacing: -1px;
  }
  .footer-sep {
    font-size: 22px;
    color: #1A1B2E;
    opacity: 0.3;
  }
  .footer-text {
    font-size: 22px;
    font-weight: 400;
    color: #1A1B2E;
    opacity: 0.45;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="top-accent"></div>
  <div class="deco-circle dc-1"></div>
  <div class="deco-circle dc-2"></div>
  <div class="deco-circle dc-3"></div>

  <span class="slide-number">5 / 5</span>

  <div class="content">
    <p class="eyebrow">La vérité</p>
    <p class="line-1">Se sentir bien<br>d'abord.</p>
    <p class="line-2">pour pouvoir</p>
    <p class="line-accent">se sentir bien<br>à plusieurs.</p>
    <div class="beta-badge">
      <div class="beta-dot"></div>
      <span class="beta-text">Bêta privée · Marseille · Été 2026</span>
    </div>
  </div>

  <div class="footer">
    <span class="footer-logo">ekho</span>
    <span class="footer-sep">·</span>
    <span class="footer-text">Le bon lieu, maintenant</span>
    <span class="footer-sep">·</span>
    <span class="footer-text">Marseille</span>
  </div>
</div>
</body>
</html>
