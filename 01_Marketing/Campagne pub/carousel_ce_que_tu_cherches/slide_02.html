<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ekho — Slide 2/5</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #F2EDE7;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 90px 130px;
  }

  /* Big decorative question marks */
  .deco-q {
    position: absolute;
    font-family: 'Poppins', sans-serif;
    font-weight: 900;
    font-style: italic;
    color: #1A1B2E;
    opacity: 0.04;
    line-height: 1;
    user-select: none;
  }
  .dq-1 { font-size: 500px; top: -60px; right: -40px; }
  .dq-2 { font-size: 280px; bottom: 90px; left: -20px; transform: rotate(-15deg); }
  .dq-3 { font-size: 140px; top: 120px; left: 80px; transform: rotate(10deg); }

  /* Slide number */
  .slide-number {
    position: absolute;
    top: 54px;
    right: 64px;
    font-size: 26px;
    font-weight: 400;
    color: #1A1B2E;
    opacity: 0.25;
    letter-spacing: 3px;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    text-align: left;
    width: 100%;
    padding: 0 20px;
  }

  .intro {
    font-size: 36px;
    font-weight: 700;
    color: #1A1B2E;
    opacity: 0.45;
    letter-spacing: 1px;
    margin-bottom: 40px;
    text-transform: uppercase;
  }

  .line-main {
    font-size: 90px;
    font-weight: 900;
    color: #1A1B2E;
    line-height: 1.1;
    margin-bottom: 48px;
  }

  .line-accent {
    font-size: 100px;
    font-weight: 900;
    font-style: italic;
    color: #6B54FF;
    line-height: 1.1;
    border-left: 8px solid #6B54FF;
    padding-left: 32px;
  }

  /* Arrow */
  .swipe {
    position: absolute;
    bottom: 140px;
    right: 64px;
    font-size: 22px;
    color: #1A1B2E;
    opacity: 0.3;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .swipe::after {
    content: '→';
    font-size: 28px;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 90px;
    background: #F2EDE7;
    border-top: 1.5px solid rgba(26,27,46,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .footer-logo {
    font-size: 28px;
    font-weight: 900;
    font-style: italic;
    color: #1A1B2E;
    letter-spacing: -1px;
  }
  .footer-sep {
    font-size: 22px;
    color: #1A1B2E;
    opacity: 0.3;
  }
  .footer-text {
    font-size: 22px;
    font-weight: 400;
    color: #1A1B2E;
    opacity: 0.45;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="slide">
  <span class="deco-q dq-1">?</span>
  <span class="deco-q dq-2">?</span>
  <span class="deco-q dq-3">?</span>

  <span class="slide-number">2 / 5</span>

  <div class="content">
    <p class="intro">La vraie question</p>
    <p class="line-main">n'est pas</p>
    <p class="line-accent">« où<br>aller ? »</p>
  </div>

  <div class="swipe">swipe</div>

  <div class="footer">
    <span class="footer-logo">ekho</span>
    <span class="footer-sep">·</span>
    <span class="footer-text">Le bon lieu, maintenant</span>
    <span class="footer-sep">·</span>
    <span class="footer-text">Marseille</span>
  </div>
</div>
</body>
</html>
