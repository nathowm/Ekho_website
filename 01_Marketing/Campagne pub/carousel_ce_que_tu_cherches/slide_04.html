<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ekho — Slide 4/5</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #F2EDE7;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 80px 130px;
  }

  /* Slide number */
  .slide-number {
    position: absolute;
    top: 54px;
    right: 64px;
    font-size: 26px;
    font-weight: 400;
    color: #1A1B2E;
    opacity: 0.25;
    letter-spacing: 3px;
  }

  .content {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
  }

  .intro {
    font-size: 30px;
    font-weight: 700;
    color: #1A1B2E;
    opacity: 0.35;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 70px;
  }

  /* Mood cards */
  .mood-row {
    display: flex;
    align-items: center;
    gap: 36px;
    margin-bottom: 40px;
    width: 100%;
  }

  .mood-tag {
    display: flex;
    align-items: center;
    gap: 20px;
    background: #1A1B2E;
    border-radius: 60px;
    padding: 22px 44px;
    width: fit-content;
  }
  .mood-tag.social { background: #6B54FF; }
  .mood-tag.energique { background: #1A1B2E; }

  .mood-icon {
    font-size: 44px;
    line-height: 1;
  }

  .mood-label {
    font-size: 54px;
    font-weight: 900;
    color: #F2EDE7;
    letter-spacing: -1px;
  }

  .mood-desc {
    font-size: 28px;
    font-weight: 400;
    color: #1A1B2E;
    opacity: 0.4;
    margin-left: 4px;
    margin-top: 4px;
    align-self: flex-end;
    margin-bottom: 4px;
  }

  .divider {
    width: 100%;
    height: 2px;
    background: rgba(26,27,46,0.08);
    margin: 50px 0 48px;
  }

  .conclusion {
    font-size: 58px;
    font-weight: 900;
    font-style: italic;
    color: #1A1B2E;
    line-height: 1.2;
  }
  .conclusion span {
    color: #6B54FF;
  }

  /* Arrow */
  .swipe {
    position: absolute;
    bottom: 140px;
    right: 64px;
    font-size: 22px;
    color: #1A1B2E;
    opacity: 0.3;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .swipe::after {
    content: '→';
    font-size: 28px;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 90px;
    background: #F2EDE7;
    border-top: 1.5px solid rgba(26,27,46,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .footer-logo {
    font-size: 28px;
    font-weight: 900;
    font-style: italic;
    color: #1A1B2E;
    letter-spacing: -1px;
  }
  .footer-sep {
    font-size: 22px;
    color: #1A1B2E;
    opacity: 0.3;
  }
  .footer-text {
    font-size: 22px;
    font-weight: 400;
    color: #1A1B2E;
    opacity: 0.45;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="slide">
  <span class="slide-number">4 / 5</span>

  <div class="content">
    <p class="intro">Trois états</p>

    <div class="mood-row">
      <div class="mood-tag calme">
        <span class="mood-icon">〰</span>
        <span class="mood-label">Calme</span>
      </div>
      <span class="mood-desc">recharge, focus</span>
    </div>

    <div class="mood-row">
      <div class="mood-tag social">
        <span class="mood-icon" style="font-size:38px;">⚬⚬</span>
        <span class="mood-label">Social</span>
      </div>
      <span class="mood-desc">lien, présence</span>
    </div>

    <div class="mood-row">
      <div class="mood-tag energique">
        <span class="mood-icon">⚡</span>
        <span class="mood-label">Énergique</span>
      </div>
      <span class="mood-desc">mouvement, vibe</span>
    </div>

    <div class="divider"></div>

    <p class="conclusion">Trois lieux<br><span>différents.</span></p>
  </div>

  <div class="swipe">swipe</div>

  <div class="footer">
    <span class="footer-logo">ekho</span>
    <span class="footer-sep">·</span>
    <span class="footer-text">Le bon lieu, maintenant</span>
    <span class="footer-sep">·</span>
    <span class="footer-text">Marseille</span>
  </div>
</div>
</body>
</html>
