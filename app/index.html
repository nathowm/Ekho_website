<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Télécharger ekho</title>
  <meta name="description" content="Télécharge l'app ekho sur l'App Store ou Google Play."/>
  <meta name="robots" content="noindex, follow"/>
  <meta name="theme-color" content="#1A1B23"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png"/>
  <script>
    // Redirection immédiate vers le bon store selon l'appareil
    (function () {
      var IOS = 'https://apps.apple.com/fr/app/ekho-app/id6763037724';
      var ANDROID = 'https://play.google.com/store/apps/details?id=fr.ekho.app';
      var SITE = '/#telecharger';
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
      var isAndroid = /Android/i.test(ua);
      window.location.replace(isIOS ? IOS : isAndroid ? ANDROID : SITE);
    })();
  </script>
  <link rel="stylesheet" href="/fonts/poppins.css"/>
  <style>
    :root { --p: #4B3BB3; --dark: #1A1B2E; --bg: #F2EDE7; --muted: rgba(26,27,46,0.72); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--dark);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: -.05em; color: var(--p); text-decoration: none; }
    h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.03em; margin: 18px 0 8px; }
    p { font-size: .9rem; color: var(--muted); line-height: 1.6; margin-bottom: 22px; }
    .stores { display: flex; flex-direction: column; gap: 10px; max-width: 280px; margin: 0 auto; }
    .store-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px;
                 padding: 13px 22px; border-radius: 100px; background: var(--dark); color: #fff; text-decoration: none;
                 font-size: .84rem; font-weight: 700; }
    .store-btn:hover, .store-btn:focus-visible { background: var(--p); }
    .store-btn small { display: block; font-size: .6875rem; font-weight: 600; opacity: .75; letter-spacing: .04em; text-transform: uppercase; }
    .store-btn .store-lbl { text-align: left; line-height: 1.15; }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/">ekho</a>
    <h1>Redirection vers ton store…</h1>
    <p>Si rien ne se passe, choisis ton store :</p>
    <div class="stores">
      <a href="https://apps.apple.com/fr/app/ekho-app/id6763037724" class="store-btn"><svg height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg><span class="store-lbl"><small>Télécharger sur</small>App Store</span></a>
      <a href="https://play.google.com/store/apps/details?id=fr.ekho.app" class="store-btn"><svg height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M3.18 23.76c.3.17.64.22.99.14l12.76-7.37-2.77-2.76-10.98 10zM.35 1.28C.13 1.6 0 2.04 0 2.59v18.82c0 .55.13.99.36 1.31l.07.07 10.54-10.54v-.25L.42 1.21l-.07.07zM20.96 10.33l-2.73-1.58-3.07 3.07 3.07 3.07 2.75-1.59c.78-.45.78-1.52-.02-1.97zM4.17.24l12.76 7.37-2.77 2.77L3.18.38C3.54.3 3.88.36 4.17.54V.24z"/></svg><span class="store-lbl"><small>Disponible sur</small>Google Play</span></a>
    </div>
  </main>
</body>
</html>
